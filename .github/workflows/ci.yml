name: TrustMesh CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
      - name: Verify schema migrations
        env:
          TRUSTMESH_DATABASE_URL: sqlite:///./migration_ci.db
        run: alembic upgrade head && alembic check
      - run: python -m compileall -q app.py sdk.py demo_agent.py resume_demo.py tool_registry.py evaluate_dataset.py
